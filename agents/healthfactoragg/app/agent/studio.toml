[project]
name = "healthfactor-agent-aggressive"

[stack]
runtime = "agentcore"
protocols = ["A2A"]

[network]
default = "bsc-testnet"

[wallet]
kind = "altana"
keystore_dir = "../../.studio/wallets"
session_file = "../../.studio/wallets/altana-session.json"
# Run `bag wallet new` in agents/healthfactoragg — then update wallet + registryId in apps/web/lib/catalog.ts
address = "0x0000000000000000000000000000000000000000"

[llm]
provider = "openai"
model = "kr/claude-sonnet-4.5"
base_url = "http://127.0.0.1:20128/v1"

[payments.erc8183]
currency = "0xc70B8741B8B07A6d61E54fd4B20f22Fa648E5565"
price = "100000000000000000"
min_price = "0"
max_price = ""
quote_ttl_seconds = 900
default_estimated_completion_seconds = 600
poll_interval_seconds = 30
auto_settle = false

[storage]
kind = "local"

[budget]
enabled = false
acknowledged_at = "2026-08-29T12:34:54Z"
max_per_topup_usd = 1.0
max_per_day_usd = 3.0
max_per_month_usd = 15.0

[identity]
endpoint = "https://healthfactoragg.ammlabs.fun/"
agent_id = 0
