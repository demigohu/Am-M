services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amm}
      POSTGRES_DB: amm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - amm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amm -d amm"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  amm_pg:
